server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ── Güvenlik Header'ları ──
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://db.teklifpro.tr;" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Kök adres → landing (tanıtım). Panel: /index.html
    location = / {
        try_files /landing.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # admin.html güvenlik — IP kısıtlaması için yorum kaldırın
    location = /admin.html {
        # allow 1.2.3.4;  # Kendi IP adresiniz
        # deny all;
        try_files $uri =404;
    }
}
